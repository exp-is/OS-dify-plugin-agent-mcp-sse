name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DIFY_PLUGIN_CLI_VERSION: "0.6.10"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        id: meta
        run: |
          version=$(sed -n 's/^version: *//p' manifest.yaml)
          name=$(sed -n 's/^name: *//p' manifest.yaml)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi
          echo "file=${name}-${version}.difypkg" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${DIFY_PLUGIN_CLI_VERSION}" --repo langgenius/dify-plugin-daemon \
            -p dify-plugin-linux-amd64 -O "${RUNNER_TEMP}/dify"
          chmod +x "${RUNNER_TEMP}/dify"
          "${RUNNER_TEMP}/dify" plugin package . -o "${{ steps.meta.outputs.file }}"

      - name: Sign and verify plugin
        env:
          DIFY_PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.DIFY_PLUGIN_SIGNING_PRIVATE_KEY }}
          PACKAGE_FILE: ${{ steps.meta.outputs.file }}
        run: |
          if [ -z "$DIFY_PLUGIN_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set the DIFY_PLUGIN_SIGNING_PRIVATE_KEY repository secret before releasing."
            exit 1
          fi

          umask 077
          key_dir=$(mktemp -d "${RUNNER_TEMP}/dify-signing.XXXXXX")
          trap 'rm -rf -- "$key_dir"' EXIT
          # Dify CLI expects PKCS#1 PEM keys.
          printf '%s' "$DIFY_PLUGIN_SIGNING_PRIVATE_KEY" |
            openssl rsa -traditional -out "$key_dir/private.pem"
          unset DIFY_PLUGIN_SIGNING_PRIVATE_KEY
          openssl rsa -in "$key_dir/private.pem" -RSAPublicKey_out -out "$key_dir/public.pem"

          "${RUNNER_TEMP}/dify" signature sign "$PACKAGE_FILE" \
            --private_key "$key_dir/private.pem" --authorized_category community
          "${RUNNER_TEMP}/dify" signature verify "${PACKAGE_FILE%.difypkg}.signed.difypkg" \
            --public_key "$key_dir/public.pem"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.meta.outputs.file }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "$PACKAGE_FILE" "${PACKAGE_FILE%.difypkg}.signed.difypkg" \
            --title "${GITHUB_REF_NAME}" --generate-notes
