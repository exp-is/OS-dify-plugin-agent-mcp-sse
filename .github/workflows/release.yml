name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DIFY_PLUGIN_CLI_VERSION: "0.6.10"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        id: meta
        run: |
          version=$(sed -n 's/^version: *//p' manifest.yaml)
          name=$(sed -n 's/^name: *//p' manifest.yaml)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi
          echo "file=${name}-${version}.difypkg" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${DIFY_PLUGIN_CLI_VERSION}" --repo langgenius/dify-plugin-daemon \
            -p dify-plugin-linux-amd64 -O "${RUNNER_TEMP}/dify"
          chmod +x "${RUNNER_TEMP}/dify"
          "${RUNNER_TEMP}/dify" plugin package . -o "${{ steps.meta.outputs.file }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.meta.outputs.file }}" \
            --title "${GITHUB_REF_NAME}" --generate-notes
